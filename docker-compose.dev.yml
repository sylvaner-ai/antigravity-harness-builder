services:
  postgres:
    image: postgres:17
    container_name: ahb-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ahb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ahb_dev_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ahb_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ahb_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ahb_user} -d $${POSTGRES_DB:-ahb_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ahb_pgdata_dev:
